[project]
name = "langchain-demo"
version = "0.1.0"
description = ""
authors = [
    {name = "Anupam Sharma",email = "anupamsharma10@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0.0"
dependencies = [
    "openai (>=2.36.0,<3.0.0)",
    "langchain (>=1.2.18,<2.0.0)",
    "langchain-openai (>=1.2.1,<2.0.0)",
    "fastmcp (>=3.2.4,<4.0.0)",
    "langchain-mcp-adapters (>=0.2.2,<0.3.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "boto3 (>=1.43.9,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
pytest-cov = ">=7.0.0,<8.0.0"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/guardrails/create_bedrock_guardrail.py",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise SystemExit\\(main\\(\\)\\)",
    "sys\\.exit\\(main\\(\\)\\)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
